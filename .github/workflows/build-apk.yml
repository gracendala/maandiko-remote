name: Build MaAndiko Remote APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine Project Directory
        id: proj-dir
        run: |
          if [ -d "remote-app" ]; then
            echo "DIR=remote-app" >> $GITHUB_OUTPUT
          else
            echo "DIR=." >> $GITHUB_OUTPUT
          fi

      - name: Install Root Dependencies
        run: |
          npm install

      - name: Install Remote App Dependencies
        run: |
          if [ "${{ steps.proj-dir.outputs.DIR }}" = "remote-app" ]; then
            cd remote-app
            npm install
          fi

      - name: Build Web Application
        run: |
          cd ${{ steps.proj-dir.outputs.DIR }}
          npm run build

      - name: Add and Sync Android Platform
        run: |
          cd ${{ steps.proj-dir.outputs.DIR }}
          npx cap add android || true
          npx cap sync android

      - name: Inject MaAndiko Official Icons
        run: |
          cd ${{ steps.proj-dir.outputs.DIR }}
          node generate-android-icons.cjs

      - name: Build Android Debug APK
        run: |
          cd ${{ steps.proj-dir.outputs.DIR }}/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaAndiko-Remote-APK
          path: ${{ steps.proj-dir.outputs.DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
